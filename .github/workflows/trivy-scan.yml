# Trivy: Scan of current branch
# Trivy is a comprehensive and versatile security scanner.
# Trivy has scanners that look for security issues, and targets where it can find those issues.
# https://github.com/aquasecurity/trivy
# ---------------------------------
    name: Trivy - branch scan
    on:
      pull_request:
      push:
        branches:
          - main
    jobs:
      scan:
        permissions:
          contents: read
          security-events: write
        name: Build
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v7
    
          - name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@master
            env:
              # Trivy only detects a file named exactly requirements.txt, so the
              # test dependencies in requirements-dev.txt would otherwise go
              # unscanned. requirements-top.txt is deliberately left out, since
              # it would duplicate findings already reported for requirements.txt.
              TRIVY_FILE_PATTERNS: 'pip:.*requirements(-dev)?\.txt'
            with:
              scan-type: "fs"
              ignore-unfixed: true
              format: "sarif"
              output: "trivy-results.sarif"
              severity: "CRITICAL,HIGH"
    
          - name: Upload Trivy scan results to GitHub Security tab
            uses: github/codeql-action/upload-sarif@v4
            with:
              sarif_file: "trivy-results.sarif"
              category: trivy